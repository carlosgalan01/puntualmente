name: grabar trenes
# De reserva: sólo graba si el grabador continuo no ha dejado una foto en los últimos 4 minutos.
# Los datos van a la rama «datos», no a main (ver grabar-continuo.yml).
on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub a veces se retrasa unos minutos)
  workflow_dispatch:
permissions:
  contents: write
concurrency: grabar
jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: datos
          path: almacen
      - working-directory: almacen
        run: mkdir -p datos && python3 ../grabar.py --si-hace-falta
      - working-directory: almacen
        run: |
          git config user.name "grabador" && git config user.email "grabador@users.noreply.github.com"
          git add datos && git commit -qm "datos $(date -u +%FT%H:%M)" || exit 0
          # si a la vez se ha subido otra cosa, se recoge y se reintenta: así no se pierde ninguna foto
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
