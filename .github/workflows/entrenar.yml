name: entrenar modelo
on:
  schedule:
    - cron: "0 3 * * *"   # cada noche, con todo lo grabado hasta entonces
  workflow_dispatch:
permissions:
  contents: write
concurrency: grabar
jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q scikit-learn numpy
      - run: python modelo/entrenar.py --csv datos/*.csv --horizonte 30 --tendencia 5 --salida web/base/modelo.json
      - run: cd modelo && python agrupar.py --csv ../datos/*.csv --salida ../web/base/familias.json
      - run: |
          git config user.name "entrenador" && git config user.email "entrenador@users.noreply.github.com"
          git add web/base/modelo.json web/base/familias.json && git commit -qm "modelo reentrenado $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
